name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-ci.yml@ec720ea5c4faee5939a7137714272b214f7ee6f8 # v2.0.0-rc.25
    with:
      working_directory: .

  notify:
    name: Notify downstream workflows
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Send repository dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api repos/${{ github.repository }}/dispatches \
              --method POST \
              -f event_type=ci-main-success \
              -f "client_payload[sha]=${{ github.sha }}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
